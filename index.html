<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2028" />
    <title>Clingy Dingy – timed climbing</title>
  </head>
  <body>
    <section id="game" class="game">
      <div class="split">
        <div class="panel" id="panel-me"><canvas id="cv-me" aria-label="Your wall"></canvas></div>
        <div class="opp-area" id="opp-area"><div id="opp-grid" class="opp-grid"></div></div>
      </div>

      <!-- HUD: narrow broadcast bar (never covers the lanes) -->
      <div id="hud" class="hud hidden" aria-live="off">
        <div class="hud-bar">
          <div class="hud-p me" id="hud-me"><span class="av"></span><div class="hud-txt"><b id="hud-me-name"></b><small id="hud-me-sub"></small></div></div>
          <div class="hud-time"><small>TIME</small><b id="hud-time">0.00</b></div>
          <div class="hud-p opp" id="hud-op"><div class="hud-txt"><b id="hud-op-name"></b><small id="hud-op-sub"></small></div><span class="av"></span></div>
        </div>
        <div class="hud-race" id="hud-race"></div>
        <div class="hud-caps" id="hud-caps"></div>
      </div>

      <div class="tap-pads" id="tap-pads" aria-hidden="true" style="display:none">
        <i class="l"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></i>
        <i class="r"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></i>
      </div>

      <div id="overlay" class="overlay"></div>
      <div id="ad-dock" class="ad-dock hidden" aria-label="Ad"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
